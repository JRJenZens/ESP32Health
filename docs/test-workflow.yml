name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check dist/ESP32Health.js
          node --check ha-client.js
          node --check app.js
          node --check demo.js
      - name: Check metadata
        run: python3 -c "import json; json.load(open('hacs.json')); json.load(open('package.json'))"
