<!doctype html>
<html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32Health · Custom card contract test</title>
<body style="font-family:system-ui;background:#f4eaed;margin:20px">
<p>Test fixture · syntetiske data · bruger Home Assistant-kortets API</p>
<button id="offline">Afbryd testforbindelse</button><button id="fall">Aktivér syntetisk faldsignal</button>
<p id="saved" role="status">Editor: ingen ændringer</p>
<esp32health-card id="card"></esp32health-card><h2>Visuel korteditor</h2><div id="editor"></div>
<script type="module">
import {ESP32HealthCard} from '../dist/ESP32Health.js';
import {createDemo} from '../demo.js';
const demo=createDemo();
const listeners=new Map();
const connection={connected:true,addEventListener:(name,fn)=>listeners.set(name,[...(listeners.get(name)||[]),fn]),removeEventListener:(name,fn)=>listeners.set(name,(listeners.get(name)||[]).filter(f=>f!==fn))};
const hass={...demo.hass,connection};delete hass.connected;
const card=document.querySelector('#card');card.setConfig(demo.config);card.hass=hass;
const editor=ESP32HealthCard.getConfigElement();editor.setConfig(demo.config);editor.hass=hass;
editor.addEventListener('config-changed',event=>{document.querySelector('#saved').textContent='Editor: config-changed modtaget · '+event.detail.config.devices.length+' enheder';card.setConfig(event.detail.config);card.hass=hass;});document.querySelector('#editor').append(editor);
document.querySelector('#offline').onclick=()=>{connection.connected=!connection.connected;for(const fn of listeners.get(connection.connected?'ready':'disconnected')||[])fn();};
document.querySelector('#fall').onclick=()=>{hass.states['binary_sensor.demo_fall']={...hass.states['binary_sensor.demo_fall'],state:'on'};card.hass={...hass};};
window.addEventListener('pagehide',()=>demo.close());
</script></body></html>
