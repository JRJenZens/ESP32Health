name: HACS validation
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dashboard package with HACS
        uses: hacs/action@main
        with:
          category: plugin
          comment: 'false'
